name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,service]"
      - run: ruff check unitts/contracts unitts/engine_sdk unitts/runtime unitts/engines unitts/services unitts/managed unitts/workers unitts/providers/indextts.py unitts/core/capabilities.py tests/contracts tests/runtime tests/integration tests/test_indextts.py tests/test_execution_contracts.py
      - run: mypy
      - run: python -m pytest -m "not integration"
      - run: python -m build
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install -e ".[dev,service]"
      - run: python -m pytest tests/integration tests/contracts
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -f infrastructure/docker/api.Dockerfile .
      - run: docker build -f engines/dummy/Dockerfile .
